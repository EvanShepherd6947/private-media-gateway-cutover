[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-media-gateway-cutover"
version = "0.1.0"
description = "Privacy-gated media processing through an OpenAI-compatible Infrai endpoint."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
media-gateway = "private_media_gateway.creator_delivery:run"

[tool.hatch.build.targets.wheel]
packages = ["src/private_media_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
